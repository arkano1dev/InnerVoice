name: Private Docker runtime
on:
  push:
    branches: [main, refactor/private-voice-gateway]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Test the private stack with synthetic audio
        run: |
          if [ "$(wc -l < /proc/swaps)" -eq 1 ]; then
            swap_file=$(mktemp /var/tmp/innervoice-swap.XXXXXX)
            trap 'sudo swapoff "$swap_file"; rm -f "$swap_file"' EXIT
            dd if=/dev/zero of="$swap_file" bs=1M count=64 status=none
            mkswap "$swap_file"
            sudo swapon "$swap_file"
          fi
          test "$(wc -l < /proc/swaps)" -gt 1
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nftables weston pulseaudio pulseaudio-utils
          python3 deploy/egress-policy --gateway 192.0.2.1 --port 9443 | sudo nft -f -
          python3 deploy/egress-policy | sudo nft -f -
          curl -fsSL --retry 3 https://github.com/anchore/grype/releases/download/v0.122.1/grype_0.122.1_linux_amd64.tar.gz -o "$RUNNER_TEMP/grype.tar.gz"
          echo "f1ba7e2917ee1395618de20a98da0aa7c0fb1788927797651047c50502a37538  $RUNNER_TEMP/grype.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/grype.tar.gz" -C "$RUNNER_TEMP" grype
          export IV_TEST_SCANNER="$RUNNER_TEMP/grype"
          bash tests/docker_private_runtime.sh
