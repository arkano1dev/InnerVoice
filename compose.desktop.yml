services:
  desktop:
    build:
      context: ./clients
      dockerfile: Dockerfile.desktop
    user: "${IV_DESKTOP_UID:?}:${IV_DESKTOP_GID:?}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: 384m
    cpus: 1.0
    pids_limit: 96
    environment:
      XDG_SESSION_TYPE: wayland
      XDG_RUNTIME_DIR: /run/innervoice-runtime
      WAYLAND_DISPLAY: /run/innervoice/wayland
      QT_QPA_PLATFORM: wayland
      PULSE_SERVER: unix:/run/innervoice/pulse/native
    tmpfs:
      - "/run/innervoice-runtime:mode=0700,uid=${IV_DESKTOP_UID:?},gid=${IV_DESKTOP_GID:?}"
    volumes:
      - type: bind
        source: "${IV_DESKTOP_WAYLAND_SOCKET:?}"
        target: /run/innervoice/wayland
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${IV_DESKTOP_PULSE:?}/native"
        target: /run/innervoice/pulse/native
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${IV_DESKTOP_CONFIG:?}"
        target: /home/innervoice/.config/innervoice-desktop
        bind:
          create_host_path: false
      - type: bind
        source: "${IV_DESKTOP_STATE:?}"
        target: /home/innervoice/.local/state/innervoice-desktop
        bind:
          create_host_path: false
networks:
  default:
    driver_opts:
      com.docker.network.bridge.name: iv-desktop0
